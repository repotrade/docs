{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<meta name="theme-color" content="#1f6feb">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-text">
<style>
  @font-face {
    font-family: 'SF Pro Text';
    src: url('https://yoursite.com/assets/fonts/SF-Pro-Text-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
</style>
{% endblock %}

{% block styles %}
{{ super() }}
<style>
  body {
    background-color: #0d1117;
    color: #f0f6fc;
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    margin: 0;
    padding: 0;
    font-size: clamp(0.875rem, 0.8rem + 0.375vw, 1rem);
  }

  .md-grid {
    max-width: 100%;
    margin: 0;
  }

  .content-container {
    width: 100%;
    max-width: 1200px;
    margin: clamp(1rem, 0.75rem + 1.25vw, 2rem) auto;
    padding: 0 clamp(0.5rem, 0.4rem + 0.5vw, 1rem);
  }

  .content-box {
    width: 100%;
    background-color: #0d1117;
    border: 1px solid #3d444d;
    border-radius: 0.375rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .content-header {
    border-bottom: 1px solid #3d444d;
    padding: clamp(0.5rem, 0.6rem + 0.75vw, 1rem) clamp(1rem, 0.85rem + 0.75vw, 1.5rem);
    background-color: #161b22;
  }

  .content-header h1 {
    margin: 0;
    padding: 0;
    font-size: clamp(1.125rem, 1rem + 0.625vw, 1.25rem);
    font-weight: 600;
    color: #f0f6fc;
  }

  .content-section {
    border-bottom: 1px solid #3d444d;
    padding: clamp(1rem, 0.85rem + 0.75vw, 1.25rem) clamp(1rem, 0.85rem + 0.75vw, 1.5rem);
  }

  .content-section:last-child {
    border-bottom: none;
  }

  .content-section h2 {
    margin: 0 0 clamp(0.75rem, 0.65rem + 0.5vw, 1rem) 0;
    padding: 0;
    font-size: clamp(1rem, 0.9rem + 0.5vw, 1.125rem);
    font-weight: 600;
    color: #f0f6fc;
  }

  .content-section ul {
    margin: 0;
    padding: 0 0 0 clamp(1rem, 0.9rem + 0.5vw, 1.25rem);
    list-style-type: none;
  }

  .content-section li {
    position: relative;
    margin-bottom: clamp(1rem, 0.9rem + 0.5vw, 1.25rem);
    padding-left: clamp(0.375rem, 0.325rem + 0.25vw, 0.5rem);
  }

  .content-section li:last-child {
    margin-bottom: 0;
  }

  .content-section li:before {
    content: "•";
    color: #4493f8;
    position: absolute;
    left: clamp(-0.875rem, -0.8rem + -0.375vw, -1rem);
  }

  .term {
    color: #f0f6fc;
    font-weight: 600;
  }

  .definition {
    color: #9198a1;
    font-size: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
    display: block;
    margin-top: clamp(0.2rem, 0.175rem + 0.125vw, 0.25rem);
  }

  a {
    color: #4493f8;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  @media (min-width: 1024px) {
    .content-box {
      width: 60%;
      margin: 0 auto;
    }
  }

  .md-typeset h1,
  .md-typeset h2,
  .md-typeset h3,
  .md-typeset p,
  .md-typeset ul {
    color: inherit;
    font-weight: inherit;
    line-height: inherit;
    margin: 0;
    padding: 0;
  }
</style>
{% endblock %}

{% block content %}
<div class="content-container">
  <div class="content-box">
    <div class="content-header">
      <h1>{{ page.title }}</h1>
    </div>
    <div class="content-section">
      {{ page.content }}
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const mainContent = document.querySelector('.content-section');

    if (!mainContent) return;

    const sections = [];
    let currentSection = null;
    let currentElements = [];

    Array.from(mainContent.children).forEach(el => {
      if (el.tagName === 'H2') {
        if (currentSection) {
          sections.push({
            heading: currentSection,
            elements: currentElements
          });
        }
        currentSection = el;
        currentElements = [];
      } else {
        currentElements.push(el);
      }
    });

    if (currentSection) {
      sections.push({
        heading: currentSection,
        elements: currentElements
      });
    }

    mainContent.innerHTML = '';

    sections.forEach(section => {
      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'content-section';

      sectionDiv.appendChild(section.heading);

      section.elements.forEach(el => {
        if (el.tagName === 'UL') {
          el.querySelectorAll('li').forEach(li => {
            const text = li.innerHTML;

            if (text.includes(' - ')) {
              const parts = text.split(' - ', 2);

              if (parts.length === 2) {
                li.innerHTML = `<span class="term">${parts[0]}</span><span class="definition">${parts[1]}</span>`;
              }
            }
          });
        }

        sectionDiv.appendChild(el);
      });

      mainContent.appendChild(sectionDiv);
    });

    mainContent.classList.remove('content-section');
  });
</script>
{% endblock %}
